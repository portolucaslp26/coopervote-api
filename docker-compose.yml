services:
  coopervote-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coopervote-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://coopervote-db:5432/coopervote
      - SPRING_DATASOURCE_USERNAME=coopervote
      - SPRING_DATASOURCE_PASSWORD=coopervote123
      - PORT=8080
    depends_on:
      coopervote-db:
        condition: service_healthy

  coopervote-db:
    image: postgres:16-alpine
    container_name: coopervote-db
    environment:
      - POSTGRES_DB=coopervote
      - POSTGRES_USER=coopervote
      - POSTGRES_PASSWORD=coopervote123
    volumes:
      - coopervote_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopervote -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  coopervote_db_data:
